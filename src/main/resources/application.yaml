server:
  port: 8081
spring:
  application:
    # 下一步：Prometheus、Loki、Tempo 和 AIOps 都使用这个统一服务名。
    name: merchantflow
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hmdp}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6380}
    password: ${REDIS_PASSWORD:202167}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: merchantflow
      environment: ${DEPLOYMENT_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:hmdp-cache-delete-producer}
hmdp:
  seckill:
    order-topic: ${SECKILL_ORDER_TOPIC:seckill-order-topic}
  cache:
    delete-topic: ${CACHE_DELETE_TOPIC:cache-delete-compensation-topic}
    redis-delete-force-fail: ${CACHE_REDIS_DELETE_FORCE_FAIL:false}
    # 启动和定时校准只重建可由 MySQL 推导出的业务缓存，不处理登录态等运行态 Key。
    reconcile:
      enabled: ${CACHE_RECONCILE_ENABLED:true}
      delay-ms: ${CACHE_RECONCILE_DELAY_MS:300000}
  aksk:
    access-key: ${AKSK_ACCESS_KEY:merchantflow-ak}
    secret-key: ${AKSK_SECRET_KEY:merchantflow-sk}
    nonce-ttl-seconds: ${AKSK_NONCE_TTL_SECONDS:300}
    timestamp-tolerance-seconds: ${AKSK_TIMESTAMP_TOLERANCE_SECONDS:300}
  ops:
    thread-snapshot:
      # 两次短采样只在 CPU 告警后触发；上限同时在 Java 服务和 MCP 客户端校验。
      sample-interval-ms: ${OPS_THREAD_SAMPLE_INTERVAL_MS:200}
      top-threads: ${OPS_THREAD_TOP_THREADS:10}
      max-frames: ${OPS_THREAD_MAX_FRAMES:20}
  order:
    timeout-minutes: ${ORDER_TIMEOUT_MINUTES:15}
    timeout-scan-delay-ms: ${ORDER_TIMEOUT_SCAN_DELAY_MS:60000}
  chat:
    model:
      base-url: ${CHAT_MODEL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${CHAT_MODEL_API_KEY:}
      model-name: ${CHAT_MODEL_NAME:qwen-plus}
      temperature: 0.7
      max-tokens: 1024
    session:
      ttl-minutes: 30
      max-history: 20
    # 流式调用必须同时具备总时长、输出大小和排队上限，避免持续 SSE 占满线程和堆内存。
    stream:
      call-timeout-seconds: ${CHAT_CALL_TIMEOUT_SECONDS:150}
      max-characters: ${CHAT_MAX_STREAM_CHARACTERS:32768}
      max-events: ${CHAT_MAX_STREAM_EVENTS:1024}
    executor:
      pool-size: ${CHAT_EXECUTOR_POOL_SIZE:10}
      queue-capacity: ${CHAT_EXECUTOR_QUEUE_CAPACITY:50}
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  config: classpath:logback-spring.xml
  level:
    com.hmdp: debug
    root: info
