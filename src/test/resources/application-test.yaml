# 集成测试专用配置：连接本机 Docker 暴露的端口，不使用 Compose 容器内部服务名。
server:
  port: 0

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/${MYSQL_DATABASE:hmdp}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USERNAME:root}
    password: ${TEST_MYSQL_PASSWORD:}
  redis:
    host: 127.0.0.1
    port: 6380
    password: ${TEST_REDIS_PASSWORD:}
    # 集成测试使用独立 Redis DB，避免污染本地登录态、秒杀库存和观测实验数据。
    database: 15

hmdp:
  cache:
    # 测试不执行启动预热，预热流程由专门的 Redis 集成测试覆盖。
    reconcile:
      enabled: false

rocketmq:
  name-server: 127.0.0.1:9876

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
