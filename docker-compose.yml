name: merchantflow

services:
  mysql:
    image: mysql:5.7
    container_name: merchantflow-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: hmdp
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [merchantflow-internal]

  redis:
    image: redis:7-alpine
    container_name: merchantflow-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" PING"]
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [merchantflow-internal]

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: merchantflow-rocketmq-namesrv
    command: ["sh", "mqnamesrv"]
    ports:
      - "9876:9876"
    restart: unless-stopped
    healthcheck:
      # 这里只验证 NameServer TCP 已接受连接，不能用 clusterList，否则会与 Broker 启动形成循环依赖。
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [merchantflow-internal]

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: merchantflow-rocketmq-broker
    command: ["sh", "-c", "export JAVA_OPT_EXT='-server -Xms256m -Xmx256m -Xmn128m'; ./mqbroker -c /tmp/broker.conf"]
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - ./docker/rocketmq/broker.conf:/tmp/broker.conf:ro
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      # Broker 只有注册到 NameServer 并能被管理命令查询后才算可供消费者使用。
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 | grep -q 'broker-a'"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    networks: [merchantflow-internal]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merchantflow-backend
    # RocketMQ 客户端初始化的瞬时网络超时不应让业务永久离线；Docker 会在依赖恢复后重试启动。
    restart: unless-stopped
    cpus: ${MERCHANTFLOW_CPUS:-1.0}
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: hmdp
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # MySQL 和本机演示脚本使用 Asia/Shanghai，JVM 必须显式统一时区。
      TZ: Asia/Shanghai
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      AKSK_ACCESS_KEY: ${AKSK_ACCESS_KEY}
      AKSK_SECRET_KEY: ${AKSK_SECRET_KEY}
      CACHE_REDIS_DELETE_FORCE_FAIL: ${CACHE_REDIS_DELETE_FORCE_FAIL:-false}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai -javaagent:/app/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: merchantflow
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "true"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DEPLOYMENT_ENVIRONMENT:-local},service.version=1.0.0
      CHAT_MODEL_API_KEY: ${CHAT_MODEL_API_KEY:-}
    ports:
      - "${MERCHANTFLOW_MANAGEMENT_HOST_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    networks:
      merchantflow-internal:
      aiops-observe:
        aliases: [merchantflow]

  nginx:
    image: nginx:1.25-alpine
    container_name: merchantflow-nginx
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [merchantflow-internal]

networks:
  merchantflow-internal:
  aiops-observe:
    external: true
    name: aiops-observe

volumes:
  mysql-data:
  redis-data:
