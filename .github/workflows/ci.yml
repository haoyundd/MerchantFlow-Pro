name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - run: mvn -s settings.xml -DskipTests package
      - run: docker network create aiops-observe
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.lab.yml --env-file .env.example --profile lab config --quiet
